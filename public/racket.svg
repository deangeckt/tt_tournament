<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Table tennis racket and ball">
  <!-- Handle, drawn first so the blade overlaps its top end. -->
  <g transform="rotate(-32 30 26)">
    <!-- The handle runs well clear of the blade: at 16px the silhouette is all the
         icon has, and a short one reads as a lollipop rather than a racket. -->
    <rect x="26.5" y="38" width="7" height="24" rx="3.5" fill="#8a5a34" />
    <rect x="24.8" y="36" width="10.4" height="7" rx="3" fill="#6f4526" />
    <!-- Blade: red rubber, the side a right-hander shows the camera. -->
    <circle cx="30" cy="26" r="15.5" fill="#d43b2f" />
    <circle cx="30" cy="26" r="15.5" fill="none" stroke="#9e2418" stroke-width="2.5" />
    <circle cx="25" cy="20.5" r="5" fill="#e8695e" opacity="0.5" />
  </g>
  <!-- The ball, clear of the blade so both read at 16px. -->
  <circle cx="51" cy="15" r="8" fill="#f7b32b" />
  <circle cx="48.5" cy="12.5" r="2.6" fill="#fde3a7" opacity="0.85" />
</svg>
