<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Named racket.svg, not favicon.svg: Chrome caches a favicon by URL and keeps
         serving the stale one through hard reloads, so replacing the icon means
         replacing its filename. -->
    <link rel="icon" type="image/svg+xml" href="./racket.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- One unconditional tag rather than a media-scoped pair: store/theme.ts rewrites
         this element's content from the *resolved* theme, which is a choice and not
         only a system setting, and a media attribute would gate it on the system one. -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Search. There is exactly one indexable document here: hash routing means every
         screen is the same URL, and a share link's payload rides in the fragment, which
         browsers never send to a server. So the whole SEO surface is this head plus what
         React renders into it — hence the absolute canonical, the noscript summary below,
         and the JSON-LD naming the club. Absolute urls are unavoidable here (canonical,
         og:image and sitemap all forbid relative ones), so they are the one place a fork
         has to edit; the Vite base stays relative. -->
    <!-- The sport has two names in Hebrew and a manager searching for this app is as
         likely to type either, so "פינג פונג" sits in the title beside "טניס שולחן"
         rather than being left to the keywords tag nobody reads. The unspaced spelling
         "פינגפונג" is a separate token to a search engine, so it appears too — but in
         the visible copy (noscript here, the home screen's empty state in the app),
         because a synonym a reader never sees is a hidden keyword. "ארגון" is in the
         description for the same reason: people search for organising a competition as
         often as for managing one. -->
    <title>ניהול תחרות טניס שולחן (פינג פונג) בחינם — דרך בן חיפה</title>
    <meta
      name="description"
      content="אפליקציה חינמית לארגון וניהול תחרות טניס שולחן (פינג פונג): הגרלה, בתים ונוק-אאוט, הזנת תוצאות וטבלאות דירוג לפי חוקי ITTF. הכול בדפדפן, בעברית, בלי הרשמה."
    />
    <!-- Google ignores this one; Bing, Yandex and a few Israeli aggregators still read it. -->
    <meta
      name="keywords"
      content="ניהול תחרות טניס שולחן, ארגון תחרות טניס שולחן, ניהול תחרויות טניס שולחן, תחרות טניס שולחן, ניהול תחרות פינג פונג, ארגון תחרות פינג פונג, תחרות פינג פונג, תחרות פינגפונג, ניהול תחרות פינגפונג, טורניר טניס שולחן, טורניר פינג פונג, ניהול טורניר טניס שולחן, תוכנה לניהול תחרויות טניס שולחן בחינם, דרך בן, דרך בן טניס שולחן, טניס שולחן חיפה, טבלת בתים, הגרלת טורניר, ITTF, table tennis tournament manager, ping pong tournament"
    />
    <link rel="canonical" href="https://deangeckt.github.io/tt_tournament/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="דרך בן — טניס שולחן חיפה" />

    <meta name="apple-mobile-web-app-title" content="טורנירים" />

    <!-- These links are read far more often than they are searched for: they go into a
         WhatsApp group, and the card is the first thing anyone sees of the app. Hence
         og:title keeps the club's own wording while <title> above is written for the
         search result — a club member reading the card already knows what the sport is
         called, and the plural "תחרויות" the card carries is a phrasing the title's
         singular does not. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="דרך בן — טניס שולחן חיפה" />
    <meta property="og:locale" content="he_IL" />

      property="og:description"
      content="ארגון וניהול תחרות טניס שולחן (פינג פונג) בחינם: הגרלה, בתים ונוק-אאוט, תוצאות וטבלאות דירוג חיות לפי חוקי ITTF — הכול בדפדפן, בלי הרשמה ובלי שרת."
    />
    <meta property="og:url" content="https://deangeckt.github.io/tt_tournament/" />

    <meta name="twitter:title" content="ניהול תחרויות טניס שולחן — דרך בן, חיפה" />
    <meta
      name="twitter:description"
      content="ארגון וניהול תחרות טניס שולחן (פינג פונג) בחינם: הגרלה, בתים ונוק-אאוט, תוצאות וטבלאות דירוג חיות לפי חוקי ITTF — הכול בדפדפן, בלי הרשמה ובלי שרת."

    <meta name="twitter:image" content="https://deangeckt.github.io/tt_tournament/og.jpg" />

    <!-- Two things a crawler cannot infer from a single-page app: that this software is
         free and what it does, and that "דרך בן" is a table tennis club in Haifa rather
         than a phrase. Kept to types that need no address or opening hours — a
         LocalBusiness without one is a warning in Search Console, not a rich result. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "https://deangeckt.github.io/tt_tournament/#app",
            "name": "ניהול תחרויות טניס שולחן",

              "ניהול תחרויות פינג פונג",

              "טורנירים - דרך בן"
            ],
            "url": "https://deangeckt.github.io/tt_tournament/",
            "description": "אפליקציה חינמית לארגון וניהול תחרות טניס שולחן (פינג פונג): הגרלה אקראית עם זרע שמור, בתים, נוק-אאוט וליגה, הזנת תוצאות מהירה או מפורטת, וטבלאות דירוג חיות לפי שרשרת שובר השוויון של ITTF. הכול רץ בדפדפן, בלי שרת ובלי חשבון.",
            "keywords": "ניהול תחרות טניס שולחן, ארגון תחרות טניס שולחן, תחרות פינג פונג, ניהול תחרות פינגפונג, טורניר טניס שולחן, table tennis tournament manager",
            "applicationCategory": "SportsApplication",
            "operatingSystem": "Any (web browser)",
            "browserRequirements": "Requires JavaScript",
            "inLanguage": ["he", "en"],
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "ILS" },
            "license": "https://opensource.org/licenses/MIT",
            "screenshot": "https://deangeckt.github.io/tt_tournament/og.jpg",
            "featureList": [
              "הגרלת טורניר אקראית עם זרע שמור לשחזור ההגרלה",
              "בתים ובית גמר, נוק-אאוט, וליגה (round robin)",

              "טבלאות דירוג חיות עם שרשרת שובר השוויון של ITTF",
              "שיתוף התוצאות בקישור או ב-QR והדפסה ל-PDF",
              "רשימת שחקנים קבועים עם היסטוריה ומאזן קריירה"
            ],
            "publisher": { "@id": "https://deangeckt.github.io/tt_tournament/#club" }
          },
          {
            "@type": "SportsOrganization",
            "@id": "https://deangeckt.github.io/tt_tournament/#club",

            "alternateName": ["דרך בן", "Derech Ben Table Tennis Haifa"],

            "areaServed": { "@type": "City", "name": "חיפה" },

            "sameAs": [
              "https://www.facebook.com/p/%D7%97%D7%95%D7%92%D7%99-%D7%98%D7%A0%D7%99%D7%A1-%D7%A9%D7%95%D7%9C%D7%97%D7%9F-%D7%91%D7%97%D7%99%D7%A4%D7%94-%D7%95%D7%94%D7%A6%D7%A4%D7%95%D7%9F-61564986761748/",
              "https://github.com/deangeckt/tt_tournament"
            ]
          }
        ]
      }

    <script>
      // Set direction and theme before the bundle loads. Without this the page paints
      // LTR for a moment on every load, which reads as a broken layout in Hebrew, and
      // flashes the wrong theme — a white page in a dark room.
      try {
        var l = localStorage.getItem('tt.locale');
        if (l !== 'he' && l !== 'en') l = 'he';
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'he' ? 'rtl' : 'ltr';
      } catch (e) {}
      try {
        // Only the *resolved* theme is stamped, so CSS has one thing to look at.
        var p = localStorage.getItem('tt.theme');
        if (p !== 'light' && p !== 'dark') p = 'system';
        var d =
          p === 'system'
            ? window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
            : p === 'dark';
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
        document.documentElement.style.colorScheme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- The only prose a crawler that does not run scripts will ever see here. It is in
         noscript rather than inside #root because React replaces #root's children on
         mount: static copy there would either flash and vanish or have to be hidden,
         and text hidden from readers but left for crawlers is the definition of
         cloaking. Googlebot renders the app itself and reads the real headings. -->
    <noscript>
      <h1>ניהול תחרויות טניס שולחן (פינג פונג)</h1>
      <p>
        אפליקציה חינמית וקוד פתוח לארגון וניהול תחרות טניס שולחן: מזינים את המשתתפים,
        מגרילים את הטורניר, מקישים תוצאות תוך כדי המשחקים, והטבלאות והבתים מתעדכנים לבד.
        הכול רץ בדפדפן — בלי שרת, בלי חשבון ובלי מעקב.
      </p>
      <h2>מה יש בה</h2>
      <ul>
        <li>פורמטים לכל רמה: בתים ובית גמר, נוק-אאוט, או ליגה (round robin).</li>
        <li>כמה רמות מקבילות (א', ב', ג') באותו ערב.</li>
        <li>הגרלה אקראית עם זרע שמור, כך שאפשר לשחזר אותה ולוודא שלא סודרה מראש.</li>
        <li>טבלאות דירוג חיות לפי שרשרת שובר השוויון של ITTF: נקודות, מפגש ישיר, יחס משחקונים, יחס נקודות, הגרלה.</li>
        <li>שיתוף התוצאות בקישור או בקוד QR, והדפסה ל-PDF.</li>
        <li>רשימת שחקנים קבועים עם תמונה, מאזן קריירה והיסטוריית תחרויות.</li>
      </ul>
      <h2>למי זה מתאים</h2>
      <p>
        לכל מי שמארגן תחרות פינגפונג ולא רוצה לנהל אותה על דף: מועדון טניס שולחן, בית
        ספר, מקום עבודה או ערב חברים. מארבעה משתתפים ועד כמה רמות במקביל באותו ערב,
        ובלי להתקין שום דבר — פותחים את הקישור בטלפון או בטאבלט ומתחילים.
      </p>
      <p>
        הכלי נבנה עבור <strong>דרך בן — טניס שולחן חיפה</strong>, מועדון וחוגי טניס שולחן
        בחיפה ובצפון, והוא פתוח לשימוש כל מועדון.
        <a
          href="https://www.facebook.com/p/%D7%97%D7%95%D7%92%D7%99-%D7%98%D7%A0%D7%99%D7%A1-%D7%A9%D7%95%D7%9C%D7%97%D7%9F-%D7%91%D7%97%D7%99%D7%A4%D7%94-%D7%95%D7%94%D7%A6%D7%A4%D7%95%D7%9F-61564986761748/"
          >עמוד המועדון</a
        >
        ·
        <a href="https://github.com/deangeckt/tt_tournament">קוד המקור ב-GitHub</a>
      </p>
      <p>יש להפעיל JavaScript כדי להשתמש באפליקציה.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
