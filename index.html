<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Named racket.svg, not favicon.svg: Chrome caches a favicon by URL and keeps
         serving the stale one through hard reloads, so replacing the icon means
         replacing its filename. -->
    <link rel="icon" type="image/svg+xml" href="./racket.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="ניהול טורנירי טניס שולחן — הגרלה, תוצאות וטבלאות" />
    <title>ניהול תחרויות טניס שולחן</title>
    <script>
      // Set direction and theme before the bundle loads. Without this the page paints
      // LTR for a moment on every load, which reads as a broken layout in Hebrew, and
      // flashes the wrong theme — a white page in a dark room.
      try {
        var l = localStorage.getItem('tt.locale');
        if (l !== 'he' && l !== 'en') l = 'he';
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'he' ? 'rtl' : 'ltr';
      } catch (e) {}
      try {
        // Only the *resolved* theme is stamped, so CSS has one thing to look at.
        var p = localStorage.getItem('tt.theme');
        if (p !== 'light' && p !== 'dark') p = 'system';
        var d =
          p === 'system'
            ? window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
            : p === 'dark';
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
        document.documentElement.style.colorScheme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
