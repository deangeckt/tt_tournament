    <meta charset="UTF-8" />
    <!-- Named racket.svg, not favicon.svg: Chrome caches a favicon by URL and keeps
         serving the stale one through hard reloads, so replacing the icon means
         replacing its filename. -->
    <link rel="icon" type="image/svg+xml" href="./racket.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- One unconditional tag rather than a media-scoped pair: store/theme.ts rewrites
         this element's content from the *resolved* theme, which is a choice and not
         only a system setting, and a media attribute would gate it on the system one. -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Search. There is exactly one indexable document here: hash routing means every
         screen is the same URL, and a share link's payload rides in the fragment, which
         browsers never send to a server. So the whole SEO surface is this head plus what
         React renders into it — hence the absolute canonical, the noscript summary below,
         and the JSON-LD naming the club. Absolute urls are unavoidable here (canonical,
         og:image and sitemap all forbid relative ones), so they are the one place a fork
         has to edit; the Vite base stays relative. -->

    <script>
      // Set direction and theme before the bundle loads. Without this the page paints
      // LTR for a moment on every load, which reads as a broken layout in Hebrew, and
      // flashes the wrong theme — a white page in a dark room.
      try {
        var l = localStorage.getItem('tt.locale');
        if (l !== 'he' && l !== 'en') l = 'he';
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'he' ? 'rtl' : 'ltr';
      } catch (e) {}
      try {
        // Only the *resolved* theme is stamped, so CSS has one thing to look at.
        var p = localStorage.getItem('tt.theme');
        if (p !== 'light' && p !== 'dark') p = 'system';
        var d =
          p === 'system'
            ? window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
            : p === 'dark';
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
        document.documentElement.style.colorScheme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>

  <body>
    <div id="root"></div>
    <!-- The only prose a crawler that does not run scripts will ever see here. It is in
         noscript rather than inside #root because React replaces #root's children on
         mount: static copy there would either flash and vanish or have to be hidden,
         and text hidden from readers but left for crawlers is the definition of
         cloaking. Googlebot renders the app itself and reads the real headings. -->
    <noscript>
      <h1>ניהול תחרויות טניס שולחן</h1>
      <p>
        אפליקציה חינמית וקוד פתוח לניהול תחרות טניס שולחן במועדון: מזינים את המשתתפים,
        מגרילים את הטורניר, מקישים תוצאות תוך כדי המשחקים, והטבלאות והבתים מתעדכנים לבד.
        הכול רץ בדפדפן — בלי שרת, בלי חשבון ובלי מעקב.
      </p>
      <h2>מה יש בה</h2>
      <ul>
        <li>פורמטים לכל רמה: בתים ובית גמר, נוק-אאוט, או ליגה (round robin).</li>
        <li>כמה רמות מקבילות (א', ב', ג') באותו ערב.</li>
        <li>הגרלה אקראית עם זרע שמור, כך שאפשר לשחזר אותה ולוודא שלא סודרה מראש.</li>
        <li>טבלאות דירוג חיות לפי שרשרת שובר השוויון של ITTF: נקודות, מפגש ישיר, יחס משחקונים, יחס נקודות, הגרלה.</li>
        <li>שיתוף התוצאות בקישור או בקוד QR, והדפסה ל-PDF.</li>
        <li>רשימת שחקנים קבועים עם תמונה, מאזן קריירה והיסטוריית תחרויות.</li>
      </ul>
      <p>
        הכלי נבנה עבור <strong>דרך בן — טניס שולחן חיפה</strong>, מועדון וחוגי טניס שולחן
        בחיפה ובצפון, והוא פתוח לשימוש כל מועדון.
        <a
          href="https://www.facebook.com/p/%D7%97%D7%95%D7%92%D7%99-%D7%98%D7%A0%D7%99%D7%A1-%D7%A9%D7%95%D7%9C%D7%97%D7%9F-%D7%91%D7%97%D7%99%D7%A4%D7%94-%D7%95%D7%94%D7%A6%D7%A4%D7%95%D7%9F-61564986761748/"
          >עמוד המועדון</a
        >
        ·
        <a href="https://github.com/deangeckt/tt_tournament">קוד המקור ב-GitHub</a>
      </p>
      <p>יש להפעיל JavaScript כדי להשתמש באפליקציה.</p>
